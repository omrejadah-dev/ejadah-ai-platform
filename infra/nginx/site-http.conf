# Plain HTTP: the local rehearsal, and a new server before its first certificate (NGINX_SITE=http).
server {
  listen 80;

  # Let's Encrypt proves the domain by fetching a file from here (certbot service in docker-compose.prod.yml)
  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  include /etc/nginx/ejadah-locations.conf;
}
