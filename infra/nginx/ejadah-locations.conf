# Shared by the HTTP (local / redirect) and HTTPS server blocks.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";

# SMS codes: 5 per minute per IP at the edge (the API allows 10 per 10 minutes per IP behind it)
location = /api/auth/otp {
  limit_req zone=otp burst=3 nodelay;
  proxy_pass http://api;
}

location /api/ {
  limit_req zone=perip burst=60 nodelay;
  proxy_read_timeout 30s;           # pricing waits at most 20 s on the AI step
  proxy_pass http://api;
}

# health endpoints for the outside monitor (Uptime Kuma)
location = /health { proxy_pass http://api; access_log off; }
location = /ready  { proxy_pass http://api; access_log off; }

# Next.js build assets are content-hashed: cache for a year
location /_next/static/ {
  proxy_pass http://web;
  proxy_hide_header Cache-Control;   # replace Next's header instead of sending two
  add_header Cache-Control "public, max-age=31536000, immutable";
}
location ~ ^/(brand|icons|ejadah)/ {
  proxy_pass http://web;
  proxy_hide_header Cache-Control;
  add_header Cache-Control "public, max-age=86400";
}

location / {
  limit_req zone=perip burst=60 nodelay;
  # a location with its own proxy_set_header does not inherit the ones above, so all of them are repeated here
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_pass http://web;
}
