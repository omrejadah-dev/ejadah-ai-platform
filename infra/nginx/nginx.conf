# Edge for production (docs/system-design.md sections 2 and 4): TLS, compression, per-IP limits, caching of static files.
# /api goes straight to the .NET API; everything else to Next.js. Both are on the same origin, so cookies stay first-party.
worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on; tcp_nopush on; keepalive_timeout 65; server_tokens off;
  client_max_body_size 2m;

  log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s up=${upstream_response_time}s';
  access_log /var/log/nginx/access.log main;

  # compression: the city GeoJSON is ~415 KB raw and ~5x smaller gzipped
  gzip on; gzip_comp_level 5; gzip_min_length 1024; gzip_vary on; gzip_proxied any;
  gzip_types application/json application/geo+json application/javascript text/css text/plain image/svg+xml;

  # per-IP limits (the API has its own finer limits per seat and per IP behind these)
  limit_req_zone $binary_remote_addr zone=perip:20m  rate=20r/s;
  limit_req_zone $binary_remote_addr zone=otp:10m    rate=5r/m;
  limit_req_status 429;

  upstream api { server api:8080; keepalive 32; }
  upstream web { server web:3000; keepalive 32; }

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  server {
    listen 80;
    # production: uncomment the TLS server below, get certificates with certbot, and make this block only redirect:
    # return 301 https://$host$request_uri;
    include /etc/nginx/ejadah-locations.conf;
  }

  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name ai.ejadah.example;
  #   ssl_certificate     /etc/letsencrypt/live/ai.ejadah.example/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/ai.ejadah.example/privkey.pem;
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   include /etc/nginx/ejadah-locations.conf;
  # }
}
