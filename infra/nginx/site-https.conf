# HTTPS (NGINX_SITE=https). A template: nginx fills ${PUBLIC_HOST} from infra/.env when it starts (nginx's own
# $variables are left alone). The certificate is requested under the fixed name "ejadah" (certbot --cert-name ejadah),
# so moving to another domain is PUBLIC_HOST + a new certbot run, not an edit here. Steps: docs/system-design.md section 6.

# http: the Let's Encrypt check, everything else to https on the public name (also when opened by IP)
server {
  listen 80 default_server;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://${PUBLIC_HOST}$request_uri; }
}

server {
  listen 443 ssl default_server;
  http2 on;
  ssl_certificate     /etc/letsencrypt/live/ejadah/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ejadah/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # any other name (the bare IP, an old domain): send it to the public name
  if ($host != "${PUBLIC_HOST}") { return 301 https://${PUBLIC_HOST}$request_uri; }

  add_header Strict-Transport-Security "max-age=31536000" always;
  include /etc/nginx/ejadah-locations.conf;
}
