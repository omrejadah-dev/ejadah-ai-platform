# Production stack (docs/system-design.md section 6). One Hetzner server, 8 vCPU / 16 GB.
#   cp infra/.env.example infra/.env   # fill in the secrets
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env --profile db --profile monitoring up -d --build
# Local rehearsal on a dev machine (reuses the dev database on :5434, no TLS, nginx on :8080):
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/local-rehearsal.env up -d --build
name: ejadah-prod

services:
  postgres:
    profiles: ["db"]
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d   # digest pinned: the image the data was loaded and measured on
    restart: unless-stopped
    environment:
      POSTGRES_USER: ejadah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ejadah_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../data:/data:ro
    # not published to the host: only api reaches it on the internal network
    command: >
      postgres -c shared_buffers=4GB -c effective_cache_size=12GB -c work_mem=64MB -c maintenance_work_mem=1GB
               -c max_connections=120 -c max_wal_size=4GB
               -c shared_preload_libraries=pg_stat_statements -c log_min_duration_statement=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ejadah -d ejadah_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../backend
    image: ejadah-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${API_ENVIRONMENT:-Production}
      # pool capped so two api replicas stay under max_connections
      ConnectionStrings__Default: ${DB_CONNECTION:-Host=postgres;Port=5432;Username=ejadah;Password=${POSTGRES_PASSWORD};Database=ejadah_ai;Maximum Pool Size=40}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY (64+ chars)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      Sms__EchoCodeInResponse: ${SMS_ECHO:-false}
      Sms__Provider: ${SMS_PROVIDER:-}            # a real provider; the API refuses to start without one outside Development
      Sms__AllowDummy: ${SMS_ALLOW_DUMMY:-false}  # local rehearsal only: codes go to the API log
      Cors__Origins__0: ${PUBLIC_ORIGIN:-https://ai.ejadah.example}
      Embedder__Url: http://embedder:8000/   # legal search by meaning; keyword search if it is down
    extra_hosts:
      - "host.docker.internal:host-gateway"   # local rehearsal reaches the dev database on the host
    expose: ["8080"]

  # question vectors for the legal assistant (BGE-M3, CPU). First start downloads the model (~2.3 GB) into hf-cache.
  embedder:
    build: ./embedder
    image: ejadah-embedder:${TAG:-latest}
    restart: unless-stopped
    environment:
      TORCH_THREADS: "4"
    volumes:
      - hf-cache:/models
    expose: ["8000"]

  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_TILE_URL: ${TILE_URL:-}
        NEXT_PUBLIC_TILE_ATTRIBUTION: ${TILE_ATTRIBUTION:-}
    image: ejadah-web:${TAG:-latest}
    restart: unless-stopped
    expose: ["3000"]

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ejadah-locations.conf:/etc/nginx/ejadah-locations.conf:ro
      - letsencrypt:/etc/letsencrypt:ro

  # outside-in monitor; in production run it on a second small server or a free external service
  uptime:
    profiles: ["monitoring"]
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports: ["3001:3001"]
    volumes: [uptime:/app/data]

volumes:
  pgdata:
  hf-cache:
  letsencrypt:
  uptime:
