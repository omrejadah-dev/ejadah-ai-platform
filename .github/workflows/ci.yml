# Build and check on every push; on main, deploy to the server (docs/system-design.md section 6).
# Deploy needs these repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY. The server keeps infra/.env with
# the app secrets, and reads the repository with its own read-only deploy key.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build backend/Ejadah.Ai.Api/Ejadah.Ai.Api.csproj -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    env: { PUPPETEER_SKIP_DOWNLOAD: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    concurrency: { group: deploy, cancel-in-progress: false }   # one deploy at a time, none dropped
    steps:
      - name: Pull, migrate, rebuild and restart on the server (previous images stay tagged for rollback)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/ejadah
            git fetch origin && git checkout --force ${{ github.sha }}
            C="docker compose -f infra/docker-compose.prod.yml --env-file infra/.env --profile db"
            docker tag ejadah-api:latest ejadah-api:previous || true
            docker tag ejadah-web:latest ejadah-web:previous || true
            PG_CONTAINER=ejadah-prod-postgres-1 bash db/migrate.sh   # new migrations only; never --dev here
            $C up -d --build --remove-orphans
            # recreated containers get new addresses; nginx resolves its upstreams only when it (re)loads
            $C exec -T nginx nginx -s reload
            # healthy = through nginx on the public name: /ready (database loaded, api up) and a page (web up)
            HOST=$(grep -E '^PUBLIC_HOST=' infra/.env | cut -d= -f2)
            ok() { curl -fsS -o /dev/null --resolve "$HOST:443:127.0.0.1" "https://$HOST$1"; }
            for i in $(seq 1 30); do ok /ready && ok /login && { echo "deployed and ready"; exit 0; }; sleep 5; done
            echo "not ready after 150 s; roll back with: TAG=previous $C up -d" >&2; exit 1
